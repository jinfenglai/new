name: build-phoenix
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 1. 准备源码
        run: |
          set -e
          mkdir -p phoenix-base
          ZIP=$(ls *.zip | grep -v phx-assets | head -1)
          unzip -q -o "$ZIP" -d xtmp
          cp -a xtmp/phoenix-base/. phoenix-base/ || cp -a xtmp/*/. phoenix-base/
          if [ -f phx-assets.zip ]; then unzip -q -o phx-assets.zip -d phoenix-base; fi
          echo "png: $(find phoenix-base -name '*.png' | wc -l)"
          test -f phoenix-base/CMakeLists.txt

      - name: 2. 统一修正源码（字段名等）
        run: |
          cd phoenix-base
          # gpio_config_t: .pullup_en -> .pull_up_en（点号锚定，不动 i2c 的 sda_pullup_en）
          for f in components/phx_*/*.c; do
            sed -i 's/\.pullup_en/.pull_up_en/g; s/\.pulldown_en/.pull_down_en/g' "$f"
          done
          # i2c_config_t 恢复正确写法
          for f in components/phx_*/*.c; do
            sed -i 's/sda_pull_up_en/sda_pullup_en/g; s/scl_pull_up_en/scl_pullup_en/g' "$f"
          done
          # 主题组件头文件缺函数声明（zip 里的副本），补上
          printf '\n#include <stdbool.h>\nbool phx_palette_apply(uint32_t idx);\nuint32_t phx_palette_current(void);\nuint32_t phx_palette_next(void);\nvoid phx_palette_boot(void);\n' >> components/phx_palette/include/phx_palette.h
          tail -5 components/phx_palette/include/phx_palette.h
          # ESP-IDF 5.4 无 spi_master 组件（并入 driver）
          for f in components/phx_subghz/CMakeLists.txt components/phx_board/CMakeLists.txt; do
            [ -f "$f" ] && sed -i 's/ *spi_master//' "$f"
          done
          grep -n REQUIRES components/phx_subghz/CMakeLists.txt || true
          # 大小写不一致：代码 include "RGB_LED_icons.h"，生成的是 rgb_led_icons.h（Linux 区分大小写）
          sed -i 's/^[[:space:]]*"rgb_led",/    # "rgb_led",/' fam_config.py || true
          # 基座配置里不存在的应用
          sed -i 's/^[[:space:]]*"tagtinker",/    # "tagtinker",/' fam_config.py || true
          echo "--- 校验 ---"
          grep -rn "pullup_en\|pull_up_en" components/phx_nfc/phx_nfc_i2c.c | head -2 || true
          grep -rn "pullup_en\|pull_up_en" components/phx_subghz/phx_cc1101_bus_esp.c | head -2 || true

      - name: 3. 编译
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: 'phoenix-base'
          command: 'python -m pip install --quiet pillow && idf.py build'

      - name: 4. 合并单文件
        run: |
          cd phoenix-base
          ls -l build/phoenix.bin build/flash_args
          ESPTOOL="$IDF_PATH/components/esptool_py/esptool/esptool.py"
          [ -f "$ESPTOOL" ] || ESPTOOL=$(command -v esptool.py)
          echo "esptool: $ESPTOOL"
          python "$ESPTOOL" --chip esp32s3 merge_bin -o phoenix-merged.bin \
            --flash_mode qio --flash_freq 80m --flash_size 8MB @build/flash_args
          ls -lh phoenix-merged.bin
          cp phoenix-merged.bin ..

      - name: 5. 上传
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-firmware
          path: |
            phoenix-merged.bin
            phoenix-base/build/phoenix.bin
