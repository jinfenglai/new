# 凤凰固件 · 网页一键云端编译（无需 git，无需本地装任何东西）
# 用法：仓库根目录只放一个文件「基座-已打补丁.zip」+ 本工作流 → Actions → Run workflow
name: build-phoenix
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 解压源码包
        run: |
          set -e
          if ls *.zip >/dev/null 2>&1; then
            mkdir -p src && unzip -q -o *.zip -d src
            if [ -d src/phoenix-base ]; then SRC=src/phoenix-base; else SRC=$(find src -maxdepth 2 -name CMakeLists.txt | head -1 | xargs dirname); fi
          else
            SRC=$(pwd)
          fi
          echo "PHX_SRC=$SRC" >> $GITHUB_ENV
          ls "$SRC" | head -20

      - name: 编译（ESP-IDF 5.4.1 / esp32s3）
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: ${{ env.PHX_SRC }}
          command: 'idf.py build'

      - name: 合并成单文件烧录包
        run: |
          python -m pip install --quiet esptool
          cd "$PHX_SRC"
          python -m esptool --chip esp32s3 merge_bin \
            -o phoenix-merged.bin --flash_mode qio --flash_freq 80m --flash_size 8MB \
            @build/flash_args
          ls -lh phoenix-merged.bin

      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-firmware
          path: |
            ${{ env.PHX_SRC }}/phoenix-merged.bin
            ${{ env.PHX_SRC }}/build/phoenix.bin
          if-no-files-found: error
