# 凤凰固件 · 云端自动编译（GitHub Actions）
# 用法：把 phoenix-base 目录推到 GitHub 仓库根目录 → Actions 自动跑 → 下载 Artifact
# 产物：phoenix-merged.bin（0x0 单文件烧录包）+ 三个分区文件
name: build-phoenix

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 确认工程结构
        run: |
          ls -la
          test -f CMakeLists.txt || { echo "::error::请在仓库根目录放 phoenix-base 内容"; exit 1; }

      - name: 编译（ESP-IDF 5.4.1 / esp32s3）
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: '.'
          command: 'idf.py build'

      - name: 合并成单文件烧录包
        run: |
          python -m pip install --quiet esptool
          python -m esptool --chip esp32s3 merge_bin \
            -o phoenix-merged.bin --flash_mode qio --flash_freq 80m --flash_size 8MB \
            @build/flash_args
          ls -lh phoenix-merged.bin

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-firmware
          path: |
            phoenix-merged.bin
            build/phoenix.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
