name: build-phoenix
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 1. 看清仓库里有什么
        run: |
          echo "=== 根目录 ==="; ls -la
          echo "=== 找 zip ==="; find . -maxdepth 2 -name "*.zip" -printf "%p %k KB\n" || true
          echo "=== 找 CMakeLists ==="; find . -maxdepth 3 -name "CMakeLists.txt" | head

      - name: 2. 准备源码目录
        run: |
          set -e
          mkdir -p phoenix-base
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "解压 $ZIP"
            unzip -q -o "$ZIP" -d xtmp
            if [ -d xtmp/phoenix-base ]; then
              cp -a xtmp/phoenix-base/. phoenix-base/
            else
              ROOT=$(dirname "$(find xtmp -maxdepth 3 -name CMakeLists.txt | head -1)")
              echo "源码根: $ROOT"
              cp -a "$ROOT"/. phoenix-base/
            fi
          elif [ -f CMakeLists.txt ]; then
            echo "源码已在根目录"
            cp -a . phoenix-base/ 2>/dev/null || true
          else
            echo "::error::仓库里既没有 zip 也没有 CMakeLists.txt，请上传 基座-已打补丁.zip"; exit 1
          fi
          echo "=== phoenix-base 内容 ==="; ls phoenix-base | head -20
          test -f phoenix-base/CMakeLists.txt || { echo "::error::解压后没有 CMakeLists.txt"; exit 1; }
          # 基座 fam_config.py 引用了不存在的应用 tagtinker，配置阶段会抛
          # FlipperManifestException；这里把它注释掉（找不到就跳过）
          # 主题组件缺公开声明 -> 追加到 header（printf 单行，避免破坏 YAML 缩进）
          printf '\n#include <stdbool.h>\nbool phx_palette_apply(uint32_t idx);\nuint32_t phx_palette_current(void);\nuint32_t phx_palette_next(void);\nvoid phx_palette_boot(void);\n' >> phoenix-base/components/phx_palette/include/phx_palette.h
          tail -6 phoenix-base/components/phx_palette/include/phx_palette.h
          # gpio_config_t 字段名修正（pull_up_en / pull_down_en）
          find phoenix-base/components -name "phx_*.c" -exec sed -i 's/pullup_en/pull_up_en/g; s/pulldown_en/pull_down_en/g' {} \;
          # 图标资源在单独的 phx-assets.zip 里（原 zip 打包时被过滤），解压覆盖回去
          if [ -f phx-assets.zip ]; then unzip -q -o phx-assets.zip -d phoenix-base && echo "图标资源已补齐"; fi
          echo "png 数量: $(find phoenix-base -name '*.png' | wc -l)"
          # 打包时过滤掉了图标资源，findmy 的 findmy_icons.h 生成不出来 -> 暂时移出构建
          true  # findmy 保留
          grep -n 'findmy' phoenix-base/fam_config.py || true
          # ESP-IDF 5.4 里 spi_master 不是独立组件（并入 driver），去掉该依赖
          for f in phoenix-base/components/phx_subghz/CMakeLists.txt phoenix-base/components/phx_board/CMakeLists.txt; do
            [ -f "$f" ] && sed -i 's/ *spi_master//' "$f" && echo "已修 $f"
          done
          if [ -f phoenix-base/fam_config.py ]; then
            sed -i 's/^[[:space:]]*"tagtinker",/    # "tagtinker",/' phoenix-base/fam_config.py
            echo "已处理 tagtinker:"; grep -n tagtinker phoenix-base/fam_config.py || echo "  已移除"
          fi

      - name: 3. 编译（ESP-IDF 5.4.1 / esp32s3）
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: 'phoenix-base'
          command: 'idf.py build'

      - name: 4. 合并单文件
        run: |
          python -m pip install --quiet esptool
          cd phoenix-base
          python -m esptool --chip esp32s3 merge_bin \
            -o phoenix-merged.bin --flash_mode qio --flash_freq 80m --flash_size 8MB \
            @build/flash_args
          ls -lh phoenix-merged.bin
          cp phoenix-merged.bin ..

      - name: 5. 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-firmware
          path: |
            phoenix-merged.bin
            phoenix-base/build/phoenix.bin
          if-no-files-found: error
